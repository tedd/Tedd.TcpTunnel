name: NuGet library
on:
  push:
    branches: [main, deploy]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nuget-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw 'Invalid package version.' }
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -cne "v$version") { throw 'Release tag must match Directory.Build.props Version.' }
      - run: dotnet restore src/Tedd.TcpTunnel.sln --locked-mode
      - run: dotnet build src/Tedd.TcpTunnel.sln -c Release --no-restore
      - run: dotnet test --project src/Tedd.TcpTunnel.Tests/Tedd.TcpTunnel.Tests.csproj -c Release --no-build --no-progress
      - run: dotnet restore samples/LibraryDemo/LibraryDemo.csproj --locked-mode
      - run: dotnet build samples/LibraryDemo/LibraryDemo.csproj -c Release --no-restore
      - run: dotnet pack src/Tedd.TcpTunnel/Tedd.TcpTunnel.csproj -c Release --no-build -o artifacts/nuget
      - name: Verify package contents and run a package-only consumer
        shell: pwsh
        run: ./scripts/smoke-nuget.ps1
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: nuget-library
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error
          retention-days: 90
      - name: Publish library and symbols to NuGet.org
        if: github.event_name == 'release'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) { throw 'Configure the NUGET_API_KEY repository secret with push access to Tedd.TcpTunnel.' }
          dotnet nuget push "artifacts/nuget/*.nupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw 'NuGet publishing failed.' }
