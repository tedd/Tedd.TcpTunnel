name: Performance benchmarks
on:
  workflow_dispatch:
    inputs:
      filter:
        description: BenchmarkDotNet filter
        default: '*'
        required: true
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Measure performance and allocations
        shell: pwsh
        env:
          BENCHMARK_FILTER: ${{ inputs.filter }}
        run: dotnet run --project src/Tedd.TcpTunnel.Benchmarks -c Release -- --filter $env:BENCHMARK_FILTER --job short --exporters json --artifacts artifacts/benchmarks
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: benchmarks-${{ github.sha }}
          path: artifacts/benchmarks
          retention-days: 90
